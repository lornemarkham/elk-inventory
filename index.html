<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELK Inventory</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #1c1a17; }
      select, select option { background: #141210; color: #d4cfc4; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #1c1a17; }
      ::-webkit-scrollbar-thumb { background: #2e2a22; border-radius: 3px; }
      /* Phones: tighter page padding, a nav that scrolls sideways instead of
         wrapping into a wall of buttons, finger-sized tap targets, and 16px
         inputs so iOS doesn't zoom in when one is focused. */
      @media (max-width: 700px) {
        .elk-header { padding: 10px 12px !important; }
        .elk-main { padding: 14px 12px 0 !important; }
        .elk-tagline { display: none; }
        .elk-actions { width: 100%; }
        .elk-nav { flex: 1 1 100%; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .elk-nav a { white-space: nowrap; padding: 10px 12px !important; }
        .elk-header button { min-height: 40px; }
        input, select, textarea { font-size: 16px !important; }
      }
      @media print {
        .elk-chrome { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
